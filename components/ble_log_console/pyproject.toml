[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-log-console"
version = "1.1.0"
description = "BLE Log recording and review console"
requires-python = ">=3.11"
dependencies = [
    "click",
    "esp-blfd[host]==1.0.0.dev0",
    "pyserial",
    "pyusb",
    "rich",
    "textual",
    "textual-fspicker",
]

[project.optional-dependencies]
build = ["pyinstaller"]
test = ["pytest", "pytest-bdd"]

[project.scripts]
ble-log-console = "console:cli"

[tool.setuptools]
py-modules = ["console", "build_exe"]
packages = [
    "src",
    "src.backend",
    "src.backend.analysis",
    "src.backend.io",
    "src.backend.pipeline",
    "src.backend.support",
    "src.backend.support.stats",
    "src.backend.support.transport",
    "src.frontend",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
esp-blfd = { path = "vendor/esp_blfd-1.0.0.dev0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl" }
