[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-log-console"
version = "1.1.1"
description = "BLE Log recording and review console"
requires-python = ">=3.11"
dependencies = [
    "click",
    "esp-blfd[host,offline]==1.0.0",
    "pyserial",
    "rich",
    "textual",
    "textual-fspicker",
]

[project.optional-dependencies]
build = ["pyinstaller"]
test = ["pytest", "pytest-bdd", "pyusb"]

[project.scripts]
ble-log-console = "console:cli"

[tool.setuptools]
py-modules = ["console", "build_exe"]
packages = [
    "src",
    "src.backend",
    "src.backend.analysis",
    "src.backend.io",
    "src.backend.pipeline",
    "src.backend.support",
    "src.backend.support.stats",
    "src.backend.support.transport",
    "src.frontend",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
esp-blfd = [
    { path = "vendor/089a5a6/esp_blfd-1.0.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11' and implementation_name == 'cpython'" },
    { path = "vendor/089a5a6/esp_blfd-1.0.0.tar.gz", marker = "sys_platform != 'linux' or platform_machine != 'x86_64' or python_version != '3.11' or implementation_name != 'cpython'" },
]
