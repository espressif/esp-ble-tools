[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-log-console"
version = "1.0.5"
description = "BLE Log capture and review console"
requires-python = ">=3.11"
dependencies = [
    "click",
    "esp-blfd==0.2.1",
    "pyserial",
    "pyusb",
    "rich",
    "textual",
    "textual-fspicker",
]

[project.optional-dependencies]
build = ["pyinstaller"]
test = ["pytest"]

[project.scripts]
ble-log-console = "console:cli"

[tool.setuptools]
py-modules = ["console", "build_exe"]
packages = [
    "src",
    "src.backend",
    "src.backend.analysis",
    "src.backend.io",
    "src.backend.pipeline",
    "src.backend.support",
    "src.backend.support.parser_core",
    "src.backend.support.stats",
    "src.backend.support.transport",
    "src.frontend",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
