name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9" # keep in sync with pyproject.toml [project.optional-dependencies] lint
      - run: ruff format --check .
      - run: ruff check .
